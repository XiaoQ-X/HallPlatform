# Activate after certificate issuance and nginx -t.
server {
    listen 80;
    server_name cysnxinli.com www.cysnxinli.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name cysnxinli.com www.cysnxinli.com;
    ssl_certificate /etc/letsencrypt/live/cysnxinli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cysnxinli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 210m;
    client_body_timeout 600s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / {
        proxy_pass http://127.0.0.1:8182;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering on;
    }
}

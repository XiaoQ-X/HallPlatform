<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>霍尔效应仿真实验</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#e6eceb;overflow:hidden;font-family:system-ui,sans-serif}
#stage{position:fixed;inset:0}
#stage canvas{width:100%;height:100%;display:block}
#loading{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center;color:#163e38}
progress{width:260px;accent-color:#13756b}
#status{white-space:pre-wrap;max-width:90vw;min-height:1.2em}
#retrybtn{display:none;margin:4px auto 0;padding:9px 26px;border:0;border-radius:999px;background:linear-gradient(135deg,#14b8a6,#0d9488);color:#fff;font-size:14px;cursor:pointer;box-shadow:0 8px 20px -8px rgba(13,148,136,.7)}
#fullscreen{position:absolute;right:12px;bottom:12px;z-index:100;width:40px;height:40px;border:1px solid #aebcba;background:rgba(255,255,255,.96);border-radius:8px;font-size:22px;cursor:pointer;pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#fullscreen:focus-visible{outline:3px solid #5eead4;outline-offset:2px}
</style></head>
<body>
<style>@media(max-width:700px) and (orientation:portrait){#stage canvas{height:62.5vw;position:absolute;top:50%;transform:translateY(-50%)}}</style>
<div id="stage">
  <canvas id="unity-canvas" tabindex="0" aria-label="霍尔效应三维实验台"></canvas>
  <div id="loading">
    <strong>霍尔效应仿真实验</strong>
    <progress id="progress" max="1" value="0"></progress>
    <span id="status">正在加载实验</span>
    <button id="retrybtn">重新加载</button>
  </div>
  <button id="fullscreen" title="全屏" aria-label="全屏">⛶</button>
</div>
<script src="hall-host.js?v=20260923formula4"></script>
<script>
const canvas=document.getElementById('unity-canvas');
const loadingEl=document.getElementById('loading');
const progressEl=document.getElementById('progress');
const statusEl=document.getElementById('status');
const retryBtn=document.getElementById('retrybtn');
const MAX_AUTO=3;
let attempt=0, loaderEl=null, waitTimer=null;

function setStatus(text,color){statusEl.textContent=text;statusEl.style.color=color||'';}
function clearTimer(){if(waitTimer){clearTimeout(waitTimer);waitTimer=null;}}

function describeError(err){
  const s=String((err&&err.message)||err||'');
  if(/Failed to fetch|NetworkError|LoadNetwork|network|fetch|aborted|suspend/i.test(s)) return '实验文件下载中断，可能是网络不稳定。';
  if(/WebAssembly|instantiate|compile|OutOfMemory|memory/i.test(s)) return '实验程序初始化失败，请使用新版 Chrome/Edge 并开启硬件加速。';
  return '实验加载失败。';
}

function loadUnity(){
  clearTimer();
  loadingEl.style.display='grid';
  if(loaderEl){loaderEl.remove();loaderEl=null;}
  retryBtn.style.display='none';
  progressEl.value=0;
  setStatus('正在加载实验');
  loaderEl=document.createElement('script');
  loaderEl.src='Build/WebGL.loader.js?v=20260923formula4';
  loaderEl.onerror=()=>handleFail('实验加载脚本下载失败，可能是网络中断。');
  loaderEl.onload=()=>{
    createUnityInstance(canvas,{
      dataUrl:'Build/WebGL.data.unityweb?v=20260923formula4',
      frameworkUrl:'Build/WebGL.framework.js.unityweb?v=20260923formula4',
      codeUrl:'Build/WebGL.wasm.unityweb?v=20260923formula4',
      streamingAssetsUrl:'StreamingAssets',companyName:'Hall Effect Lab',productName:'Hall Experiment',productVersion:'2.3.0-web.1',
      matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,2)
    },p=>{progressEl.value=p;setStatus('正在加载实验（'+Math.round(p*100)+'%）');}).then(instance=>{
      window.unityInstance=instance;window.HallHost.attach(instance);
      loadingEl.style.display='none';
      wireFullscreen();
    }).catch(err=>handleFail(describeError(err),err));
  };
  document.body.appendChild(loaderEl);
}

function handleFail(zh){
  attempt++;
  if(attempt<=MAX_AUTO){
    setStatus(zh+' 正在自动重试（'+attempt+'/'+MAX_AUTO+'）…','#9a6a1a');
    waitTimer=setTimeout(loadUnity,700*attempt);
  }else{
    setStatus(zh+' 已自动重试 '+MAX_AUTO+' 次仍失败，请检查网络后手动重试。','#9b2424');
    retryBtn.style.display='inline-block';
  }
}

retryBtn.addEventListener('click',()=>{attempt=0;loadUnity();});

function wireFullscreen(){
  const stage=document.getElementById('stage');const fsBtn=document.getElementById('fullscreen');
  const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const enterFs=()=>{const el=stage,fn=el.requestFullscreen||el.webkitRequestFullScreen;if(fn)return Promise.resolve(fn.call(el));return Promise.reject(new Error('fullscreen unavailable'));};
  const leaveFs=()=>{const d=document,fn=d.exitFullscreen||d.webkitExitFullscreen;if(fn)return Promise.resolve(fn.call(d));return Promise.reject(new Error('fullscreen unavailable'));};
  fsBtn.onclick=()=>{(isFs()?leaveFs():enterFs()).catch(()=>{setStatus('浏览器未授予全屏权限，可使用 Esc 或浏览器菜单退出。','#9a6a1a');}).finally(syncFs);};
  const syncFs=()=>{const on=isFs();fsBtn.textContent=on?'✕':'⛶';fsBtn.title=on?'退出全屏（Esc）':'全屏';};
  document.addEventListener('fullscreenchange',syncFs);document.addEventListener('webkitfullscreenchange',syncFs);
  syncFs();
}

loadUnity();
</script>
</body></html>\n

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">霍尔效应仿真算法流程图</title>
  <desc id="desc">输入 I、B 与材料参数，经过核心算法计算，叠加四种横向磁效应和误差模型，用四方向修正消除 V0、VN、VRL 与固定零点，再在已知 kE 时分离 VE。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef6f8"/>
    </linearGradient>
    <linearGradient id="input" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f4ff"/>
      <stop offset="1" stop-color="#d8ebff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eafaf3"/>
      <stop offset="1" stop-color="#d6f1e5"/>
    </linearGradient>
    <linearGradient id="error" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6e9"/>
      <stop offset="1" stop-color="#ffead0"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1edff"/>
      <stop offset="1" stop-color="#e4dcff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#20354a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L14 7L0 14Z" fill="#5c7085"/>
    </marker>
    <style>
      .cn { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .mono { font-family: "Cascadia Mono", "Consolas", monospace; }
    </style>
  </defs>

  <rect width="1600" height="620" rx="30" fill="url(#background)"/>
  <text x="800" y="68" text-anchor="middle" class="cn" font-size="32" font-weight="700" fill="#18324a">霍尔效应仿真算法流程</text>
  <text x="800" y="103" text-anchor="middle" class="cn" font-size="16" fill="#6b7d8f">从输入参数到误差修正结果显示</text>

  <line x1="365" y1="275" x2="445" y2="275" stroke="#5c7085" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="755" y1="275" x2="835" y2="275" stroke="#5c7085" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="1145" y1="275" x2="1225" y2="275" stroke="#5c7085" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="85" y="155" width="280" height="240" rx="24" fill="url(#input)" stroke="#82b7e8" stroke-width="2"/>
    <circle cx="135" cy="207" r="23" fill="#4b9be8"/>
    <text x="135" y="215" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">1</text>
    <text x="225" y="214" text-anchor="middle" class="cn" font-size="25" font-weight="700" fill="#18324a">输入实验参数</text>
    <path d="M125 255H325" stroke="#82b7e8" stroke-width="2" stroke-linecap="round"/>
    <text x="225" y="294" text-anchor="middle" class="mono" font-size="18" fill="#245a91">I、B：工作电流、磁场</text>
    <text x="225" y="326" text-anchor="middle" class="mono" font-size="17" fill="#245a91">RH、d、r0、kE</text>
    <text x="225" y="372" text-anchor="middle" class="cn" font-size="14" fill="#55718a">输入页面提供的实验参数</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="475" y="155" width="280" height="240" rx="24" fill="url(#core)" stroke="#7fc7a7" stroke-width="2"/>
    <circle cx="525" cy="207" r="23" fill="#36ad7b"/>
    <text x="525" y="215" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">2</text>
    <text x="615" y="214" text-anchor="middle" class="cn" font-size="25" font-weight="700" fill="#18324a">核心算法计算</text>
    <path d="M515 255H715" stroke="#7fc7a7" stroke-width="2" stroke-linecap="round"/>
    <text x="615" y="298" text-anchor="middle" class="mono" font-size="18" fill="#2d765d">VH = RH · I · B / d</text>
    <text x="615" y="331" text-anchor="middle" class="cn" font-size="14" fill="#557b6b">计算理想霍尔电压 VH</text>
    <text x="615" y="372" text-anchor="middle" class="cn" font-size="14" fill="#557b6b">B 在本页由实验参数直接给出</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="865" y="155" width="280" height="240" rx="24" fill="url(#error)" stroke="#e5b36b" stroke-width="2"/>
    <circle cx="915" cy="207" r="23" fill="#e39a3e"/>
    <text x="915" y="215" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">3</text>
    <text x="1005" y="214" text-anchor="middle" class="cn" font-size="25" font-weight="700" fill="#18324a">叠加误差模型</text>
    <path d="M905 255H1105" stroke="#e5b36b" stroke-width="2" stroke-linecap="round"/>
    <text x="1005" y="298" text-anchor="middle" class="mono" font-size="18" fill="#8d6b41">V0 = r0 · I</text>
    <text x="1005" y="331" text-anchor="middle" class="mono" font-size="18" fill="#8d6b41">VE = kE · I · B</text>
    <text x="1005" y="372" text-anchor="middle" class="cn" font-size="14" fill="#8d6b41">模拟不等位与厄廷豪森误差</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1255" y="155" width="280" height="240" rx="24" fill="url(#output)" stroke="#a896e8" stroke-width="2"/>
    <circle cx="1305" cy="207" r="23" fill="#8068d8"/>
    <text x="1305" y="215" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">4</text>
    <text x="1395" y="214" text-anchor="middle" class="cn" font-size="25" font-weight="700" fill="#18324a">输出显示</text>
    <path d="M1295 255H1495" stroke="#a896e8" stroke-width="2" stroke-linecap="round"/>
    <text x="1395" y="290" text-anchor="middle" class="mono" font-size="16" fill="#6d6199">V⊥ = VH + VE + VN + VRL</text>
    <text x="1395" y="318" text-anchor="middle" class="mono" font-size="14" fill="#6d6199">Vmeasured = V⊥ + V0 + Voffset</text>
    <text x="1395" y="322" text-anchor="middle" class="mono" font-size="16" fill="#6d6199">Vcorr = (V1−V2+V3−V4)/4</text>
    <text x="1395" y="354" text-anchor="middle" class="mono" font-size="16" fill="#6d6199">= VH + VE；VH = Vcorr − VE</text>
    <text x="1395" y="382" text-anchor="middle" class="cn" font-size="13" fill="#6d6199">仅在已知 kE 时分离 VE 得到理想 VH</text>
  </g>

  <rect x="255" y="485" width="1090" height="66" rx="20" fill="#ffffff" fill-opacity="0.78" stroke="#d7e3eb"/>
  <text x="800" y="513" text-anchor="middle" class="cn" font-size="15" font-weight="600" fill="#385269">四方向对称修正：V1(+I,+B)、V2(+I,−B)、V3(−I,−B)、V4(−I,+B)</text>
  <text x="800" y="537" text-anchor="middle" class="cn" font-size="13" fill="#718496">四方向消除 V0、VN、VRL 与固定零点；VE 与 VH 同换向，需已知 kE 才能进一步分离理想 VH</text>
</svg>

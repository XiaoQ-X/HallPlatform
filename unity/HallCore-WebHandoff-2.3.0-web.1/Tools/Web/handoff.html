<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>霍尔效应实验 · 联调</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#263835;background:#f4f6f5}header{height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;background:#fff;border-bottom:1px solid #ccd5d2}h1{font-size:18px;margin:0}#status{color:#516762}main{display:grid;grid-template-columns:minmax(0,1fr) 290px;height:calc(100vh - 56px)}iframe{width:100%;height:100%;border:0}aside{padding:16px;background:white;border-left:1px solid #ccd5d2;overflow:auto}label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}input,select,button{font:inherit;border:1px solid #b6c5c0;border-radius:4px;padding:8px;max-width:100%}input{width:95px}button{background:#edf4f1;cursor:pointer;margin:3px 0}button:disabled{opacity:.45;cursor:default}.commands{display:flex;flex-wrap:wrap;gap:6px}h2{font-size:15px;border-top:1px solid #d7dfdb;padding-top:16px;margin-top:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px monospace;max-height:260px;overflow:auto}#error{color:#a22424;overflow-wrap:anywhere}#count{font-variant-numeric:tabular-nums;color:#18644d}@media(max-width:900px){main{display:flex;flex-direction:column;height:auto}iframe{height:70vh;min-height:440px}aside{border:0;border-top:1px solid #ccd5d2}header{padding:0 10px;gap:10px}h1{font-size:16px}}</style></head>
<body><style>@media(max-width:900px){iframe{height:auto;aspect-ratio:16/10;min-height:0;flex:none}}</style><header><h1>霍尔效应实验</h1><span id="status">加载中</span><span id="count">0 组</span></header><main><iframe id="experiment" src="index.html" allow="fullscreen" title="霍尔效应实验台"></iframe><aside>
<div class="commands"><button data-command="init" disabled>初始化案例</button><button data-command="reset" disabled>重新开始</button></div>
<label>步骤<select id="step"><option value="1">认识仪器</option><option value="2">接线</option><option value="3">检查</option><option value="4">调节电流</option><option value="5">四方向采样</option><option value="6">结束</option></select></label>
<label>IS / mA<input id="is" type="number" min="0" max="10" step="0.05" value="3"></label>
<label>IM / A<input id="im" type="number" min="0" max="1" step="0.005" value="0.4"></label>
<div class="commands"><button data-command="set" disabled>设置电流</button><button data-command="record" disabled>记录方向</button><button data-command="finish" disabled>结束实验</button></div>
<h2>联调检查</h2><div class="commands"><button data-command="verify" disabled>运行四方向检查</button><button data-command="snapshot" disabled>读取快照</button><button data-command="export" disabled>下载 JSON</button><button id="recover">下载上次缓存</button></div>
<p id="error" role="alert"></p><h2>最近事件</h2><pre id="event">等待实验就绪</pre></aside></main>
<script>
const frame=document.getElementById('experiment'), buttons=[...document.querySelectorAll('[data-command]')];
let events=[], latest, testing=false;
const send=(method,payload)=>frame.contentWindow.HallHost.send(method,payload);
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
window.addEventListener('message',message=>{
 if(message.origin!==location.origin||message.source!==frame.contentWindow)return;
 if(message.data.source==='hall-host'&&message.data.ready){buttons.forEach(b=>b.disabled=false);document.getElementById('status').textContent='已就绪';}
 if(message.data.source!=='hall-unity')return;
 const e=message.data.event;events.push(e);latest=e;
 if(!e.isDemo)document.getElementById('count').textContent=e.state.completeGroups+' 组';
 document.getElementById('event').textContent=JSON.stringify(e,(key,value)=>key==='history'?'(事件记录)':value,2);
 if(e.type==='OnAbnormalEvent')document.getElementById('error').textContent=e.code+': '+e.detail;
});
async function stable(){
 for(let i=0;i<160;i++){send('RequestSnapshot');await delay(100);if(latest?.state.stable)return;}
 throw Error('等待稳定超时');
}
async function verify(){
 if(testing)return;testing=true;buttons.forEach(b=>b.disabled=true);
 try {
 send('ResetExperiment');await delay(100);send('InitExperiment',{schemaVersion:1,caseId:'integration-check',material:'n-silicon',thickness_mm:.5,maxIs_mA:10,maxIm_A:1});
 for(let i=0;i<6;i++)send('ConnectTerminals',{a:i,b:i+6});
 for(const [is,im] of [[1,1],[1,-1],[-1,-1],[-1,1]]){
 send('SetParameter',{name:'power',value:0});send('SetParameter',{name:'isSwitch',value:is});send('SetParameter',{name:'imSwitch',value:im});
 send('SetParameter',{name:'power',value:1});send('SetParameter',{name:'IS_mA',value:3});send('SetParameter',{name:'IM_A',value:.4});
 await stable();send('RecordMeasurement');await delay(100);
 }
 send('FinishFromWeb');await delay(200);
 const result=events.findLast(e=>e.type==='OnExperimentComplete'&&e.sessionId===latest?.sessionId);
 if(!result||result.rows.length!==1)throw Error('完整结果未返回');
 document.getElementById('status').textContent='四方向联调通过';window.hallVerification={passed:true,result};
 }catch(error){document.getElementById('error').textContent=String(error);window.hallVerification={passed:false,error:String(error)};}
 finally{testing=false;buttons.forEach(b=>b.disabled=false);}
}
buttons.forEach(button=>button.onclick=()=>{
 document.getElementById('error').textContent='';
 try{switch(button.dataset.command){
 case 'init':send('InitExperiment',{schemaVersion:1,caseId:'hall-basic',material:'n-silicon',thickness_mm:.5,maxIs_mA:10,maxIm_A:1});break;
 case 'reset':if(confirm('清空当前实验并创建新会话？'))send('ResetExperiment');break;
 case 'set':send('SetParameter',{name:'IS_mA',value:Number(document.getElementById('is').value)});send('SetParameter',{name:'IM_A',value:Number(document.getElementById('im').value)});break;
 case 'record':send('RecordMeasurement');break;
 case 'finish':send('FinishFromWeb');break;
 case 'verify':if(confirm('联调检查会重置当前实验，是否继续？'))verify();break;
 case 'snapshot':send('RequestSnapshot');break;
 case 'export':frame.contentWindow.HallHost.export();break;
 }}catch(error){document.getElementById('error').textContent=String(error);}
});
document.getElementById('step').onchange=e=>{try{send('GotoStep',{step:Number(e.target.value)});}catch(error){document.getElementById('error').textContent=String(error);}};
document.getElementById('recover').onclick=()=>{try{const saved=frame.contentWindow.HallHost.previousSession;if(!saved)throw Error('没有上次缓存');const u=URL.createObjectURL(new Blob([saved],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='hall-recovered.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}catch(error){document.getElementById('error').textContent=String(error);}};
</script></body></html>
